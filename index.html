<style>
:root{--bg:#f5f0e8;--paper:#fffdf8;--ink:#1e1b17;--muted:#746b5f;--line:#ded3c4;--accent:#8a3f37;--good:#46734d;--bad:#b44949;--soft:#ece3d6;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--serif:Georgia,"Times New Roman","Songti SC",serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:14px 14px 92px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}.brand h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:18px;padding:6px 10px;background:var(--paper);font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.tab{flex:0 0 auto;border-radius:18px;padding:8px 12px;background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--muted)}.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}.hero{background:var(--ink);color:var(--paper);border-color:var(--ink);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-48px;top:-48px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.14)}.hero-head{position:relative;display:flex;justify-content:space-between;gap:12px}.hero h2{font-family:var(--serif);font-size:34px;line-height:1.05;font-weight:500;margin:0 0 6px}.hero p{margin:0;color:rgba(255,255,255,.72);font-size:12px}.streak{min-width:78px;text-align:center;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:9px}.streak b{display:block;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}.streak span{display:block;margin-top:3px;color:rgba(255,255,255,.68);font-size:10px}.meters{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.meter{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px}.meter b{display:block;font-family:var(--serif);font-size:26px;font-weight:500;line-height:1}.meter span{display:block;color:rgba(255,255,255,.66);font-size:10px;margin-top:5px}.bar{height:6px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--paper)}.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;font-weight:600}.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ok{background:#e1ecd9;border-color:#c8ddbf;color:var(--good)}.btn.bad{background:#f3dddd;border-color:#e8c3c3;color:var(--bad)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:var(--soft);border-radius:8px;padding:10px;min-height:68px}.box b{display:block;font-family:var(--serif);font-size:27px;font-weight:500;line-height:1}.box span{display:block;color:var(--muted);font-size:11px;margin-top:6px}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{height:22px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}.heat i.on{background:#dce9d8;border-color:#b9d0b1}.word{min-height:270px;display:flex;flex-direction:column;justify-content:center;text-align:center}.ru{font-family:var(--serif);font-size:44px;line-height:1.1}.stress{font-family:var(--serif);font-size:22px;color:var(--muted);margin-top:8px}.cn{font-size:20px;margin-top:14px}.meta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:12px;padding:4px 8px;color:var(--muted);font-size:11px}.example{background:var(--soft);border-radius:8px;padding:11px;margin-top:14px;text-align:left}.example p{margin:0 0 4px}.small{color:var(--muted);font-size:12px}.options{display:grid;gap:8px}.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px}.opt.good{background:#e1ecd9;border-color:#a9c7a0;color:var(--good)}.opt.bad{background:#f3dddd;border-color:#dea9a9;color:var(--bad)}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:12px;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}.list{display:grid;gap:7px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);border-radius:8px;padding:10px}.item b{font-family:var(--serif);font-size:18px;font-weight:500}.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(245,240,232,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 14px env(safe-area-inset-bottom)}.foot-inner{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}@media(max-width:380px){.ru{font-size:36px}.hero h2{font-size:29px}.actions{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><h1>默背俄语</h1><p>每日一点，长期记住</p></div><button class="pill" id="speakBtn">发音</button></header><nav class="tabs" id="tabs"></nav><section id="view"></section></main><footer class="footer"><div class="foot-inner"><span id="count">0 / 0</span><span id="known">掌握 0</span></div></footer>
<script>
'use strict';
const WORDS=[
['привет','приве́т','你好','问候','Привет, как дела?','你好，最近怎么样？'],['здравствуйте','здра́вствуйте','您好','问候','Здравствуйте, я Анна.','您好，我是安娜。'],['спасибо','спаси́бо','谢谢','问候','Большое спасибо!','非常感谢！'],['пожалуйста','пожа́луйста','请；不客气','问候','Пожалуйста, помогите.','请帮帮我。'],['извините','извини́те','对不起；请问','问候','Извините, где метро?','请问地铁在哪？'],['до свидания','до свида́ния','再见','问候','До свидания, до завтра.','再见，明天见。'],['я','я','我','核心','Я учу русский язык.','我学俄语。'],['ты','ты','你','核心','Ты студент?','你是学生吗？'],['он','он','他','核心','Он мой друг.','他是我的朋友。'],['она','она́','她','核心','Она врач.','她是医生。'],['мы','мы','我们','核心','Мы дома.','我们在家。'],['вы','вы','您；你们','核心','Вы говорите по-русски?','您说俄语吗？'],['это','э́то','这；这是','核心','Это мой дом.','这是我的家。'],['что','что','什么','核心','Что это?','这是什么？'],['где','где','哪里','核心','Где туалет?','卫生间在哪里？'],['как','как','怎么；怎样','核心','Как дела?','最近怎么样？'],['дом','до́м','家；房子','生活','Это мой дом.','这是我的家。'],['город','го́род','城市','生活','Москва — большой город.','莫斯科是大城市。'],['улица','у́лица','街道','生活','Это красивая улица.','这是条漂亮的街。'],['магазин','магази́н','商店','生活','Я иду в магазин.','我去商店。'],['школа','шко́ла','学校','生活','Дети идут в школу.','孩子们去学校。'],['работа','рабо́та','工作；单位','生活','Я еду на работу.','我去上班。'],['книга','кни́га','书','学习','Это новая книга.','这是一本新书。'],['слово','сло́во','词；单词','学习','Это новое слово.','这是一个新单词。'],['читать','чита́ть','读','动词','Я читаю книгу.','我在读书。'],['писать','писа́ть','写','动词','Я пишу письмо.','我在写信。'],['говорить','говори́ть','说','动词','Я говорю по-русски.','我说俄语。'],['знать','зна́ть','知道','动词','Я знаю.','我知道。'],['любить','люби́ть','爱；喜欢','动词','Я люблю кофе.','我喜欢咖啡。'],['идти','идти́','走；去','动词','Я иду домой.','我回家。'],['есть','е́сть','吃；有','动词','Я ем хлеб.','我吃面包。'],['пить','пи́ть','喝','动词','Я пью воду.','我喝水。'],['вода','вода́','水','食物','Я пью воду.','我喝水。'],['хлеб','хле́б','面包','食物','Я ем хлеб.','我吃面包。'],['кофе','ко́фе','咖啡','食物','Я люблю кофе.','我喜欢咖啡。'],['чай','ча́й','茶','食物','Хочешь чай?','你想喝茶吗？'],['молоко','молоко́','牛奶','食物','Дайте молоко.','请给我牛奶。'],['яблоко','я́блоко','苹果','食物','Это вкусное яблоко.','这是个好吃的苹果。'],['один','оди́н','一','数字','У меня один билет.','我有一张票。'],['два','два́','二','数字','Два кофе, пожалуйста.','请来两杯咖啡。'],['три','три́','三','数字','У меня три брата.','我有三个兄弟。'],['четыре','четы́ре','四','数字','Четыре часа.','四点。'],['пять','пя́ть','五','数字','Пять минут.','五分钟。'],['десять','де́сять','十','数字','Десять рублей.','十卢布。'],['паспорт','па́спорт','护照','旅行','Где мой паспорт?','我的护照在哪里？'],['билет','биле́т','票；机票','旅行','У меня билет в Москву.','我有一张去莫斯科的票。'],['метро','метро́','地铁','旅行','Где метро?','地铁在哪里？'],['такси','такси́','出租车','旅行','Я вызову такси.','我叫出租车。'],['аэропорт','аэропо́рт','机场','旅行','Мы едем в аэропорт.','我们去机场。'],['помощь','по́мощь','帮助','旅行','Мне нужна помощь.','我需要帮助。']
].map((w,i)=>({id:'w'+i,ru:w[0],stress:w[1],cn:w[2],topic:w[3],ex:w[4],exCn:w[5]}));
const MODES=[['today','今日'],['card','单词卡'],['quiz','选择'],['spell','拼写'],['dict','词库'],['stats','统计']],KEY='momo_ru_pwa_v1';
let state={mode:'today',idx:0,known:{},review:{},stats:{done:0,right:0,wrong:0},daily:{date:'',newTarget:10,reviewTarget:20,newDone:0,reviewDone:0,days:{},streak:0}};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function dayOffset(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function streak(){let n=0;for(let i=0;i<365;i++){if(state.daily.days&&state.daily.days[dayOffset(-i)])n++;else break}return n}function ensure(){if(state.daily.date!==today()){state.daily.date=today();state.daily.newDone=0;state.daily.reviewDone=0;state.daily.streak=streak();save()}}
function record(ok,id){ensure();state.daily.days=state.daily.days||{};state.daily.days[today()]=1;state.daily.streak=streak();state.stats.done++;ok?state.stats.right++:state.stats.wrong++;let r=state.review[id]||{seen:0,stage:0,due:0};let isNew=!r.seen,wasDue=r.seen&&r.due<=Date.now();r.seen++;r.stage=ok?Math.min(r.stage+1,5):0;r.due=Date.now()+[600000,86400000,172800000,345600000,604800000,1296000000][r.stage];state.review[id]=r;if(ok)state.known[id]=1;else delete state.known[id];if(isNew&&state.daily.newDone<state.daily.newTarget)state.daily.newDone++;else if(wasDue&&state.daily.reviewDone<state.daily.reviewTarget)state.daily.reviewDone++;save()}
function due(){return WORDS.filter(w=>state.review[w.id]&&state.review[w.id].due<=Date.now())}function fresh(){return WORDS.filter(w=>!state.review[w.id])}function todayList(){ensure();return due().slice(0,state.daily.reviewTarget-state.daily.reviewDone).concat(fresh().slice(0,state.daily.newTarget-state.daily.newDone))}function word(){return (state.session||WORDS)[state.idx%(state.session||WORDS).length]||WORDS[0]}function speak(t){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function tabs(){$('tabs').innerHTML=MODES.map(m=>`<button class="tab ${state.mode===m[0]?'on':''}" data-m="${m[0]}">${m[1]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.mode=b.dataset.m;state.session=null;state.idx=0;render()})}function footer(){let l=state.session||WORDS;$('count').textContent=(state.idx+1)+' / '+l.length;$('known').textContent='掌握 '+Object.keys(state.known).length}function heat(){let s='';for(let i=13;i>=0;i--){let k=dayOffset(-i);s+=`<i class="${state.daily.days&&state.daily.days[k]?'on':''}" title="${k}"></i>`}return s}
function renderToday(){let list=todayList(),done=state.daily.newDone+state.daily.reviewDone,total=state.daily.newTarget+state.daily.reviewTarget,p=Math.min(100,done/Math.max(1,total)*100);$('view').innerHTML=`<div class="card hero"><div class="hero-head"><div><h2>今天背 ${list.length} 个</h2><p>新词 ${Math.max(0,state.daily.newTarget-state.daily.newDone)} · 复习 ${Math.max(0,state.daily.reviewTarget-state.daily.reviewDone)} · 总词库 ${WORDS.length}</p></div><div class="streak"><b>${state.daily.streak||0}</b><span>连续天数</span></div></div><div class="meters"><div class="meter"><b>${due().length}</b><span>到期复习</span></div><div class="meter"><b>${fresh().length}</b><span>可学新词</span></div><div class="meter"><b>${Object.keys(state.known).length}</b><span>已掌握</span></div></div><div class="bar"><i style="width:${p}%"></i></div><div class="actions"><button class="btn main" id="start">开始今日任务</button><button class="btn" id="goSpell">拼写练习</button></div></div><div class="card"><div class="grid3"><div class="box"><b>${state.daily.newDone}</b><span>今日新词</span></div><div class="box"><b>${state.daily.reviewDone}</b><span>今日复习</span></div><div class="box"><b>${state.stats.done}</b><span>总练习</span></div></div></div><div class="card"><p class="small">近 14 天学习记录</p><div class="heat">${heat()}</div></div><div class="card"><div class="row"><label>新词<input class="input" id="newTarget" type="number" value="${state.daily.newTarget}"></label><label>复习<input class="input" id="reviewTarget" type="number" value="${state.daily.reviewTarget}"></label></div><button class="btn ok" id="savePlan">保存计划</button></div>`;$('start').onclick=()=>{state.session=list.length?list:WORDS.slice(0,10);state.idx=0;state.mode='card';render()};$('goSpell').onclick=()=>{state.session=list.length?list:WORDS;state.idx=0;state.mode='spell';render()};$('savePlan').onclick=()=>{state.daily.newTarget=+$('newTarget').value||0;state.daily.reviewTarget=+$('reviewTarget').value||0;save();render()}}
function card(){let w=word();$('view').innerHTML=`<div class="card word"><div class="ru">${w.ru}</div><div class="stress">${w.stress}</div><div class="cn">${w.cn}</div><div class="meta"><span class="tag">${w.topic}</span><span class="tag">${state.review[w.id]?.seen||0} 次</span></div><div class="example"><p>${w.ex}</p><p class="small">${w.exCn}</p></div></div><div class="row"><button class="btn bad" id="no">模糊</button><button class="btn ok" id="yes">认识</button></div>`;$('yes').onclick=()=>{record(1,w.id);next()};$('no').onclick=()=>{record(0,w.id);next()}}
function quiz(){let w=word(),opts=[w.cn];while(opts.length<4){let c=WORDS[Math.floor(Math.random()*WORDS.length)].cn;if(!opts.includes(c))opts.push(c)}opts.sort(()=>Math.random()-.5);$('view').innerHTML=`<div class="card word"><div class="ru">${w.ru}</div><div class="stress">${w.stress}</div><div class="meta"><span class="tag">${w.topic}</span></div></div><div class="options">${opts.map(o=>`<button class="opt" data-a="${o}">${o}</button>`).join('')}</div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let ok=b.dataset.a===w.cn;b.classList.add(ok?'good':'bad');record(ok,w.id);setTimeout(next,350)})}
function spell(){let w=word();$('view').innerHTML=`<div class="card"><p class="small">输入俄语单词</p><div class="cn">${w.cn}</div><input class="input" id="ans" autocomplete="off" autocapitalize="off"><div class="row"><button class="btn" id="hint">提示</button><button class="btn main" id="check">检查</button></div><div id="fb" class="small" style="margin-top:10px"></div></div>`;$('hint').onclick=()=>{$('ans').value=w.ru.slice(0,Math.max(1,$('ans').value.length+1))};$('check').onclick=()=>{let ok=$('ans').value.trim().toLowerCase()===w.ru.toLowerCase();$('fb').innerHTML=ok?'正确':'答案：'+w.ru+' · '+w.stress;record(ok,w.id);setTimeout(next,700)}}
function dict(){$('view').innerHTML=[...new Set(WORDS.map(w=>w.topic))].map(t=>`<div class="card"><b>${t}</b><div class="list">${WORDS.filter(w=>w.topic===t).map(w=>`<div class="item"><span><b>${w.ru}</b><br><span class="small">${w.cn}</span></span><button class="pill" data-s="${w.ru}">听</button></div>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>speak(b.dataset.s))}
function stats(){let rate=Math.round(state.stats.right/Math.max(1,state.stats.right+state.stats.wrong)*100);$('view').innerHTML=`<div class="card"><div class="grid3"><div class="box"><b>${state.stats.done}</b><span>练习次数</span></div><div class="box"><b>${rate}%</b><span>正确率</span></div><div class="box"><b>${Object.keys(state.known).length}</b><span>掌握词</span></div></div></div><div class="card"><button class="btn bad" id="reset">重置学习记录</button></div>`;$('reset').onclick=()=>{if(confirm('确定重置学习记录？')){state.review={};state.known={};state.stats={done:0,right:0,wrong:0};state.daily.days={};state.daily.streak=0;save();render()}}}
function next(){let l=state.session||WORDS;if(state.idx>=l.length-1&&state.session){state.session=null;state.mode='today';state.idx=0}else state.idx=(state.idx+1)%l.length;render()}function render(){ensure();tabs();({today:renderToday,card,quiz,spell,dict,stats}[state.mode]||renderToday)();footer();$('speakBtn').onclick=()=>speak(word().ru)}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
